
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Classification</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #94a3b8;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
        }

        input[type="file"] {
            margin-top: 15px;
            max-width: 100%;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 280px;
            margin: 20px auto;
            border-radius: 10px;
            object-fit: contain;
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 8px;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .train-btn {
            background: #059669;
        }

        .train-btn:hover {
            background: #047857;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            background: #eff6ff;
            border-radius: 10px;
            color: #1e40af;
            display: none;
            overflow-wrap: anywhere;
        }

        #result h3 {
            margin-bottom: 10px;
        }

        #message {
            margin-top: 15px;
            color: #475569;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Image Classification</h1>

        <p class="subtitle">
            Upload an image and let our CNN model classify it.
        </p>

        <div class="upload-area">

            <h3>Select an Image</h3>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <img id="preview" alt="Image Preview">

        </div>

        <button id="predictBtn" onclick="predictImage()">
            Predict Image
        </button>

        <button class="train-btn" onclick="trainModel()">
            Train Model
        </button>

        <p id="message"></p>

        <div id="result">
            <h3>Classification Result</h3>
            <pre id="prediction"></pre>
        </div>

        <div class="footer">
            Powered by CNN Image Classification Model
        </div>

    </div>

    <script>

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");
        const message = document.getElementById("message");
        const result = document.getElementById("result");
        const prediction = document.getElementById("prediction");

        let selectedImage = null;

        // Image Preview
        imageInput.addEventListener("change", function () {

            const file = this.files[0];

            result.style.display = "none";
            selectedImage = null;

            if (!file) {
                preview.style.display = "none";
                return;
            }

            if (!file.type.startsWith("image/")) {
                message.innerText = "Please select a valid image.";
                preview.style.display = "none";
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {

                preview.src = event.target.result;
                preview.style.display = "block";

                selectedImage = event.target.result;

                message.innerText = "Image uploaded successfully.";
            };

            reader.readAsDataURL(file);

        });


        // Image Prediction
        async function predictImage() {

            if (!selectedImage) {
                message.innerText = "Please upload an image first.";
                return;
            }

            const button = document.getElementById("predictBtn");

            button.disabled = true;
            message.innerText = "Classifying image...";

            try {

                // Remove the Base64 data URL prefix
                const base64Image = selectedImage.split(",")[1];

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        image: base64Image
                    })

                });

                if (!response.ok) {
                    throw new Error("Prediction request failed.");
                }

                const data = await response.json();

                result.style.display = "block";

                prediction.textContent =
                    JSON.stringify(data, null, 4);

                message.innerText = "Prediction completed successfully!";

            }

            catch (error) {

                message.innerText = "Error: " + error.message;

            }

            finally {
                button.disabled = false;
            }

        }


        // Train Model
        async function trainModel() {

            message.innerText = "Model training started...";

            try {

                const response = await fetch("/train", {
                    method: "GET"
                });

                const data = await response.text();

                if (!response.ok) {
                    throw new Error(data);
                }

                message.innerText = data;

            }

            catch (error) {

                message.innerText = "Training error: " + error.message;

            }

        }

    </script>

</body>
</html>
